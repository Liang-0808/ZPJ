<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061014"/>
      <stop offset="0.45" stop-color="#081820"/>
      <stop offset="1" stop-color="#05263A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FA8FF"/>
      <stop offset="1" stop-color="#75CDFF"/>
    </linearGradient>
    <linearGradient id="deepBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#236BFF"/>
      <stop offset="1" stop-color="#2FA8FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18  0 0 0 0 0.66  0 0 0 0 1  0 0 0 .65 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#75CDFF" stroke-opacity=".05"/>
    </pattern>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
      .en{font-family:"Montserrat","Microsoft YaHei",Arial,sans-serif;letter-spacing:1px}
      .thin{fill:#93C9E6}
      .muted{fill:#6F8794}
      .white{fill:#E2FBFF}
      .small{font-size:22px}
      .body{font-size:26px}
      .title{font-size:58px;font-weight:900}
      .label{font-size:25px;font-weight:800}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#111"/>
  <rect x="64" y="54" width="1792" height="972" fill="url(#bg)"/>
  <rect x="64" y="54" width="1792" height="972" fill="url(#grid)" opacity=".72"/>
  <circle cx="1470" cy="190" r="460" fill="#2FA8FF" opacity=".16" filter="url(#glow)"/>
  <circle cx="360" cy="760" r="380" fill="#00D4F6" opacity=".08" filter="url(#glow)"/>

  <text x="136" y="128" class="thin en" font-size="20">+[DESIGN BY LIUYANMEI]</text>
  <text x="850" y="128" class="thin en" font-size="20">—— [ UI PORTFOLIO ]</text>
  <text x="1595" y="128" class="thin en" font-size="20">[TIME 2026]+</text>

  <text x="136" y="218" class="white title">AI驱动的用户反馈闭环验证 ↓</text>
  <text x="136" y="290" class="thin body">收集多角色反馈后，使用 AI 进行语义聚类，快速提炼高频满意点与体验优化方向，验证方案是否真正提升业务效率。</text>

  <g transform="translate(136 360)">
    <rect x="0" y="0" width="440" height="436" rx="18" fill="#07161B" stroke="#21414A" stroke-width="1.5"/>
    <text x="34" y="54" class="white label">反馈来源</text>
    <text x="34" y="100" class="thin small">运营人员 / 运维人员 / 主管部门 / 一线使用人员</text>
    <line x1="34" y1="142" x2="406" y2="142" stroke="#21414A"/>
    <text x="34" y="198" class="white label">AI处理方式</text>
    <g transform="translate(34 238)">
      <rect x="0" y="0" width="138" height="48" rx="24" fill="#102B36"/>
      <text x="26" y="32" class="thin small">统一文本</text>
      <rect x="166" y="0" width="138" height="48" rx="24" fill="#102B36"/>
      <text x="192" y="32" class="thin small">语义聚类</text>
      <rect x="0" y="76" width="138" height="48" rx="24" fill="#102B36"/>
      <text x="26" y="108" class="thin small">提炼主题</text>
      <rect x="166" y="76" width="172" height="48" rx="24" fill="#102B36"/>
      <text x="190" y="108" class="thin small">识别价值点</text>
    </g>
  </g>

  <g transform="translate(642 332)">
    <g opacity=".92">
      <path d="M54 0 H360 Q390 0 390 30 V92 Q390 122 360 122 H88 L58 154 V122 H54 Q24 122 24 92 V30 Q24 0 54 0Z" fill="#7FB8FF"/>
      <text x="70" y="50" fill="#fff" class="small">现在考核排名和投放数据</text>
      <text x="70" y="86" fill="#fff" class="small">不用再翻多个菜单找了</text>
    </g>
    <g transform="translate(470 38)" opacity=".94">
      <path d="M54 0 H420 Q450 0 450 30 V100 Q450 130 420 130 H94 L64 162 V130 H54 Q24 130 24 100 V30 Q24 0 54 0Z" fill="url(#blue)"/>
      <text x="78" y="52" fill="#fff" class="small">故障上报一个页面就能填完</text>
      <text x="78" y="88" fill="#fff" class="small">还能实时看维修进度</text>
    </g>
    <g transform="translate(104 198)" opacity=".96">
      <path d="M54 0 H452 Q482 0 482 30 V104 Q482 134 452 134 H90 L60 166 V134 H54 Q24 134 24 104 V30 Q24 0 54 0Z" fill="url(#deepBlue)"/>
      <text x="82" y="54" fill="#fff" class="small">大屏能看到全域数据</text>
      <text x="82" y="90" fill="#fff" class="small">哪块区域落后一眼就能看到</text>
    </g>
    <g transform="translate(50 390)" opacity=".7">
      <path d="M54 0 H310 Q340 0 340 30 V78 Q340 108 310 108 H92 L62 138 V108 H54 Q24 108 24 78 V30 Q24 0 54 0Z" fill="#E2FBFF"/>
      <text x="72" y="52" fill="#1B2A34" class="small">操作也更简单了</text>
    </g>
    <g transform="translate(520 304)" opacity=".56">
      <path d="M54 0 H420 Q450 0 450 30 V92 Q450 122 420 122 H90 L60 154 V122 H54 Q24 122 24 92 V30 Q24 0 54 0Z" fill="#1D2529"/>
      <text x="76" y="52" fill="#E2FBFF" class="small">月度数据汇总时间</text>
      <text x="76" y="88" fill="#E2FBFF" class="small">节省了很多</text>
    </g>
    <g transform="translate(734 -32)" opacity=".52">
      <path d="M44 0 H220 Q246 0 246 26 V58 Q246 84 220 84 H80 L56 108 V84 H44 Q18 84 18 58 V26 Q18 0 44 0Z" fill="#AFC7DF"/>
      <text x="70" y="52" fill="#1B2A34" class="small">好用了很多</text>
    </g>
  </g>

  <g transform="translate(1320 378)">
    <text x="0" y="0" class="white label">AI语义聚类满意点</text>
    <g transform="translate(0 58)">
      <circle cx="108" cy="108" r="104" fill="url(#deepBlue)"/>
      <text x="72" y="100" fill="#fff" font-size="44" font-weight="900">10+</text>
      <text x="44" y="148" fill="#fff" font-size="28" font-weight="800">信息更集中</text>
      <circle cx="344" cy="108" r="104" fill="url(#deepBlue)"/>
      <text x="310" y="100" fill="#fff" font-size="44" font-weight="900">8+</text>
      <text x="274" y="148" fill="#fff" font-size="28" font-weight="800">路径更短</text>
    </g>
    <g transform="translate(0 308)">
      <circle cx="108" cy="108" r="104" fill="url(#deepBlue)"/>
      <text x="76" y="100" fill="#fff" font-size="44" font-weight="900">6+</text>
      <text x="44" y="148" fill="#fff" font-size="28" font-weight="800">状态可追踪</text>
      <circle cx="344" cy="108" r="104" fill="url(#deepBlue)"/>
      <text x="310" y="100" fill="#fff" font-size="44" font-weight="900">9+</text>
      <text x="274" y="148" fill="#fff" font-size="28" font-weight="800">数据更直观</text>
    </g>
  </g>

  <g transform="translate(136 918)">
    <rect x="0" y="0" width="1648" height="70" rx="12" fill="#102B36" stroke="#2FA8FF" stroke-opacity=".55"/>
    <text x="44" y="45" fill="#E2FBFF" font-size="25" font-weight="700">结论：AI辅助归纳多角色反馈，帮助快速识别方案价值：信息更集中、操作更短、状态可追踪、数据更直观。</text>
  </g>
</svg>
